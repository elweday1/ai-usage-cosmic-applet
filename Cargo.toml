[package]
name = "ai-usage"
version = "0.1.2"
edition = "2024"
authors = ["nasser", "Simon Österberg <5444093+osterbergsimon@users.noreply.github.com>"]
description = "Minimal COSMIC panel applet showing AI tool usage (Claude, Codex, OpenCode, ...) with auto-detected provider tabs"
repository = "https://github.com/osterbergsimon/cosmic-applet-claude-usage"
license = "GPL-3.0-only"
readme = "README.md"

# Debian/Ubuntu/Pop!_OS packaging via `cargo deb`. Runtime libs are dlopened, so
# dpkg-shlibdeps ($auto) won't see them — list them explicitly. They're present
# on any COSMIC desktop already.
[package.metadata.deb]
maintainer = "Simon Österberg <5444093+osterbergsimon@users.noreply.github.com>"
copyright = "2026 Simon Österberg"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
extended-description = "A minimal COSMIC panel applet showing Claude Code usage as a quiet, color-coded indicator with several styles and time-to-reset displays."
depends = "$auto, libwayland-client0, libxkbcommon0, libvulkan1, libgl1"
assets = [
    ["target/release/ai-usage", "usr/bin/", "755"],
    ["data/co.osterberg.AiUsage.desktop", "usr/share/applications/", "644"],
    # statusLine writer + installer, so packaged users can feed the applet
    # (see README, "Feeding the applet").
    ["contrib/usage-writer.sh", "usr/share/ai-usage/", "755"],
    ["contrib/install-statusline.sh", "usr/share/ai-usage/", "755"],
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
dirs = "5"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
# Pinned to the libcosmic revision the COSMIC stock applets build against (cosmic-applets 1.0.0), so popup surfaces can use the transparent background.
# (which tracks master, unpinned) was cloned for this scaffold.
rev = "5a8bd9482a35ae94c1e54edf77b331c6b970f170"
default-features = false
features = ["applet", "tokio", "wayland", "multi-window", "winit"]
